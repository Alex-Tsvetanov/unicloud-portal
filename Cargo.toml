[package]
name = "unicloud-portal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "UniCloud Portal: accounts, academic profiles, enrollment, and the OpenID Connect provider for every UniCloud module"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "fs", "set-header", "timeout"] }
tower-sessions = "0.15"
tower-sessions-sqlx-store = { version = "0.16", features = ["postgres"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "time", "json", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto", "use_pem"] }
argon2 = "0.6"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.3"
subtle = "2"
time = { version = "0.3", features = ["serde", "formatting"] }
url = "2"
maud = { version = "0.27", features = ["axum"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
