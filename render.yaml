# Render Blueprint: the portal's staging, with its own PostgreSQL, on Render's free plans.
# In Render: New > Blueprint, pick this repository. Render asks once for the value marked
# "sync: false" (the token signing key, as PEM text; see the README's "Get set up").
#
# Free PostgreSQL databases expire after 30 days. Delete the database in Render and sync the
# Blueprint again; the portal rebuilds its tables and the demo data at the next start.

databases:
  - name: unicloud-portal-staging-db
    databaseName: unicloud
    user: unicloud
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"

services:
  - type: web
    name: unicloud-portal-staging
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /health
    envVars:
      # Staging: any SSO callback URL, and the staging tools at /staging (docs/sso.md)
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: unicloud-portal-staging-db
          property: connectionString
      # The Rust portal keeps its tables in their own schema, so it starts fresh next to the
      # Java portal's old tables instead of replacing the database.
      - key: APP_DB_SCHEMA
        value: portal
      # The issuer of SSO tokens is the service's own https address (RENDER_EXTERNAL_URL, set by Render)
      # The free plan has 0.1 CPU and 512 MB: keep the pool small
      - key: APP_DB_POOL_MAX
        value: "5"
      # Demo people and courses (README, "Demo accounts"). Render generates the password; it is on the
      # service's Environment page.
      - key: APP_DEMO_PASSWORD
        generateValue: true
      # Staging's own token signing key (RSA private key, PKCS#8 PEM text). Never production's.
      # The portal also reads APP_JWT_PRIVATE_KEY, the Java portal's name for it, so the existing
      # service keeps working until this is set.
      - key: APP_SIGNING_KEY_PEM
        sync: false
