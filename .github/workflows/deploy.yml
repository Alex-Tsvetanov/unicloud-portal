# Tests every pull request against PostgreSQL 17. Every merge to main also builds the image,
# deploys staging on Render, and deploys production on Azure Container Apps once a reviewer
# approves it (the "production" environment). There is one branch: main.
name: build-and-deploy

on:
  pull_request:
  push:
    branches: [main]

env:
  RESOURCE_GROUP: unicloud-rg           # must match setup-azure.sh
  CONTAINER_ENV: unicloud-env           # must match setup-azure.sh
  CONTAINER_APP: unicloud-portal
  GHCR_USERNAME: rata5  # the account that owns the GHCR_PAT token
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17               # the same version as staging and production
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: unicloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/unicloud
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test (unit, SSO conformance, portal, enrollment race)
        run: cargo test --locked

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                    # push images to GitHub Container Registry
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick image name
        id: tag
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "${{ steps.tag.outputs.image }}" .
      - name: Push (main only)
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.tag.outputs.image }}"

  # Render builds staging itself. With the Blueprint (render.yaml) it deploys every push to main on
  # its own; the deploy hook, when set, pins the exact commit that passed the tests.
  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    concurrency: staging
    steps:
      - name: Ask Render to deploy this commit
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK" ]]; then
            echo "::notice::RENDER_DEPLOY_HOOK is not set; the Render Blueprint deploys main by itself"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK&ref=$GITHUB_SHA" -o /dev/null
          echo "Render is deploying $GITHUB_SHA to staging." | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    # Production lives in the team repository, which holds the Azure secrets
    if: github.ref == 'refs/heads/main' && github.repository == 'rata5/unicloud-portal'
    runs-on: ubuntu-latest
    # The job waits here until a reviewer of the "production" environment approves it
    environment:
      name: production
      url: ${{ steps.live.outputs.url }}
    concurrency: production              # never run two deploys at once
    permissions:
      contents: read
      id-token: write                    # lets the job log in to Azure without a stored password
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy (the first run creates the app)
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}            # postgres://... from setup-azure.sh
          SIGNING_KEY: ${{ secrets.JWT_PRIVATE_KEY }}          # RSA private key, PKCS#8 PEM
        run: |
          if [[ -z "$SIGNING_KEY" || "$DATABASE_URL" != postgres* ]]; then
            echo "Set JWT_PRIVATE_KEY and a postgres:// DATABASE_URL (README, 'The pipeline')" >&2
            exit 1
          fi
          az extension add --name containerapp --upgrade --only-show-errors
          # Each replica reports its own name (CONTAINER_APP_REPLICA_NAME) in X-Served-By.
          # 10 replicas x 10 connections stays under the B1ms server's connection limit.
          ENV_VARS=(APP_ENV=production DATABASE_URL=secretref:db-url APP_SIGNING_KEY_PEM=secretref:signing-key
                    APP_DB_POOL_MAX=10)
          # The app's address is <app>.<environment's default domain>, known before the first deploy.
          # Production refuses to start without a fixed https issuer (docs/sso.md, "How the portal does it").
          DOMAIN=$(az containerapp env show -n "$CONTAINER_ENV" -g "$RESOURCE_GROUP" --query properties.defaultDomain -o tsv)
          ENV_VARS+=(APP_SSO_ISSUER="https://$CONTAINER_APP.$DOMAIN")
          if az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" > /dev/null 2>&1; then
            az containerapp secret set -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --secrets db-url="$DATABASE_URL" signing-key="$SIGNING_KEY" --output none
            # Rust needs far less than Java: 0.25 vCPU and 0.5 GiB per replica
            az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --image "$IMAGE" --cpu 0.25 --memory 0.5Gi \
              --set-env-vars "${ENV_VARS[@]}" --output none
          else
            # At least 2 replicas (no single point of failure), up to 10 under the 08:00 rush
            az containerapp create -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --environment "$CONTAINER_ENV" \
              --image "$IMAGE" --target-port 8080 --ingress external \
              --registry-server ghcr.io --registry-username "$GHCR_USERNAME" --registry-password "$GHCR_PAT" \
              --cpu 0.25 --memory 0.5Gi \
              --min-replicas 2 --max-replicas 10 \
              --scale-rule-name http-rush --scale-rule-type http --scale-rule-http-concurrency 50 \
              --secrets db-url="$DATABASE_URL" signing-key="$SIGNING_KEY" \
              --env-vars "${ENV_VARS[@]}" --output none
          fi

      - name: Check the new version is live
        id: live
        run: |
          URL="https://$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          for attempt in $(seq 1 30); do
            BODY=$(curl -fsS "$URL/health" || true)
            if [[ "$BODY" == *"$GITHUB_SHA"* ]]; then
              echo "Live at $URL" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "The new version did not answer within 5 minutes" >&2
          exit 1
