# Tests every pull request against MySQL 8.4 (production's database) and PostgreSQL 17
# (staging's). On main it also builds the image and deploys it to Azure Container Apps.
# On develop it only tests and builds: Render deploys staging from develop by itself.
name: build-and-deploy

on:
  pull_request:
  push:
    branches: [main, develop]

env:
  RESOURCE_GROUP: unicloud-rg           # must match setup-azure.sh
  CONTAINER_ENV: unicloud-env           # must match setup-azure.sh
  CONTAINER_APP: unicloud-portal
  GHCR_USERNAME: rata5  # the account that owns the GHCR_PAT token

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4                 # the same version as on Azure
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: unicloud
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: jdbc:mysql://127.0.0.1:3306/unicloud?user=root&password=test&sslMode=REQUIRED
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test (Flyway applies the migrations to MySQL first)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  # Staging runs on PostgreSQL with the copies in db/migration-postgresql. This runs the same
  # tests there. Production's deploy doesn't wait for it, so it can never hold up production.
  test-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17               # the same version as staging on Render
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: unicloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/unicloud?user=postgres&password=test
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration-postgresql
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test (Flyway applies the PostgreSQL migrations first)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                    # push images to GitHub Container Registry
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick image name
        id: tag
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "${{ steps.tag.outputs.image }}" .

      - name: Push (main only)
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.tag.outputs.image }}"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production              # never run two deploys at once
    permissions:
      contents: read
      id-token: write                    # lets the job log in to Azure without a stored password
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy (the first run creates the app)
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # The RSA key pair the app signs login tokens with (PEM text). Every replica must use
          # the same pair, or a token issued by one replica is rejected by the next.
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
        run: |
          if [[ -z "$JWT_PRIVATE_KEY" || -z "$JWT_PUBLIC_KEY" ]]; then
            echo "Add the JWT_PRIVATE_KEY and JWT_PUBLIC_KEY repository secrets (see the README's 'The pipeline')" >&2
            exit 1
          fi
          az extension add --name containerapp --upgrade --only-show-errors
          # The app reads app.jwt.private-key / app.jwt.public-key; Spring maps these variables to
          # them and accepts the PEM text directly, so no key file is needed in the image.
          ENV_VARS=(DATABASE_URL=secretref:db-url
                    APP_JWT_PRIVATE_KEY=secretref:jwt-private-key
                    APP_JWT_PUBLIC_KEY=secretref:jwt-public-key)
          if az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" > /dev/null 2>&1; then
            az containerapp secret set -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --secrets db-url="$DATABASE_URL" jwt-private-key="$JWT_PRIVATE_KEY" jwt-public-key="$JWT_PUBLIC_KEY" \
              --output none
            # Java needs 0.5 vCPU and 1 GiB per replica; setting it on every deploy keeps it that way
            az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --image "$IMAGE" --cpu 0.5 --memory 1.0Gi \
              --set-env-vars "${ENV_VARS[@]}" \
              --output none
          else
            # At least 2 replicas (no single point of failure), up to 10 when a replica
            # has more than 20 requests in flight
            az containerapp create -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
              --environment "$CONTAINER_ENV" \
              --image "$IMAGE" --target-port 8080 --ingress external \
              --registry-server ghcr.io --registry-username "$GHCR_USERNAME" --registry-password "$GHCR_PAT" \
              --cpu 0.5 --memory 1.0Gi \
              --min-replicas 2 --max-replicas 10 \
              --scale-rule-name http-rush --scale-rule-type http --scale-rule-http-concurrency 20 \
              --secrets db-url="$DATABASE_URL" jwt-private-key="$JWT_PRIVATE_KEY" jwt-public-key="$JWT_PUBLIC_KEY" \
              --env-vars "${ENV_VARS[@]}" \
              --output none
          fi

      - name: Check the new version is live
        run: |
          URL="https://$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          for attempt in $(seq 1 30); do
            BODY=$(curl -fsS "$URL/health" || true)
            if [[ "$BODY" == *"$GITHUB_SHA"* ]]; then
              echo "Live at $URL" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "The new version did not answer within 5 minutes" >&2
          exit 1
