# Spring keeps every distinct test context (one per set of test properties or profiles) open
# for reuse, and each holds a full connection pool: 15 connections (application.properties).
# With enough contexts that passes PostgreSQL's limit of 100 connections, and the next context
# fails with "sorry, too many clients already". Keeping at most two open closes the older ones
# and frees their connections. Tests that share a context still reuse it.
spring.test.context.cache.maxSize=2
