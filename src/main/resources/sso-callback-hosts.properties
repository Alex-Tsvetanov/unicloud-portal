# Single sign-on: the hosts whose callback URLs modules may register and use in production
# (docs/sso.md, "Callback URLs per environment"). Read when app.sso.callback-policy=allowlist,
# which is the default. Staging and the local mock set the policy to "any" and ignore this list.
#
# One comma-separated list. An entry is an exact host ("library.tu-sofia.bg") or every
# subdomain of a domain ("*.tu-sofia.bg", which does not include tu-sofia.bg itself). Callbacks
# must be https. Plain http is accepted only for a listed localhost, so never list localhost here.
#
# Change this file with a pull request. Taking a host out switches off the logins and logouts
# of every module that uses it at the next deploy, even if the module is still registered.
# APP_SSO_ALLOWED_CALLBACK_HOSTS overrides the whole list without a release, for emergencies.
#
# No module is live yet, so the list is empty and nothing can be registered in production.
app.sso.allowed-callback-hosts=
