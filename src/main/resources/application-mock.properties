# The local SSO mock for module developers (SPRING_PROFILES_ACTIVE=mock, see mock/docker-compose.yml
# and docs/sso.md, "Testing a module locally"). Never set this profile on staging or production:
# it gives every user the same known password and registers a client with a known secret.

# Any callback URL is accepted, registered or not
app.sso.callback-policy=any
# The address the module developers' browsers and libraries use
app.sso.issuer=${APP_SSO_ISSUER:http://localhost:8080}
# Plain http on localhost: a Secure cookie is refused there by some browsers (Safari)
app.sso.cookie-secure=false
# No proxy in front
server.forward-headers-strategy=none

# What MockSsoSeeder sets up at every start
app.mock.client-id=${MOCK_CLIENT_ID:local-module}
app.mock.client-secret=${MOCK_CLIENT_SECRET:local-secret}
app.mock.user-password=${MOCK_USER_PASSWORD:password}
