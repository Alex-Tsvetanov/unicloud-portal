spring.application.name=portal
server.port=8080

# Finish in-flight requests before a replica stops (deploys, scale-in)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# The full JDBC URL, user and password included, comes from the DATABASE_URL secret.
# Without it, the app uses a local MySQL 8.4 in Docker (see the guide's "Run it locally").
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/unicloud?user=root&password=dev&sslMode=REQUIRED}
# 10 replicas x 15 connections stays under the 171 that MySQL B1ms allows
spring.datasource.hikari.maximum-pool-size=15

# Flyway creates and upgrades the tables; Hibernate only checks the entities against them
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
#JWT
app.jwt.issuer=unicloud-portal
app.jwt.audience=unicloud-api
app.jwt.ttl-minutes=30
app.jwt.private-key=file:./secrets/private.pem
app.jwt.public-key=file:./secrets/public.pem



# Single sign-on for the other modules (docs/sso.md)
# The issuer ("iss") of SSO tokens: the portal's public https URL. The deploy sets it from the
# app's address. Empty: worked out from each request (fine locally).
app.sso.issuer=${APP_SSO_ISSUER:}
# An authorization code lives this long; a module exchanges it within seconds
app.sso.code-ttl-seconds=60
# Which callback URLs modules may use: "allowlist" (production: registered, exact, and on a host
# from sso-callback-hosts.properties) or "any" (staging: application-staging.properties)
app.sso.callback-policy=allowlist
spring.config.import=optional:classpath:sso-callback-hosts.properties
# The tables Spring Session and the authorization server need come from Flyway (V4__sso.sql)
spring.session.jdbc.initialize-schema=never
# The SSO browser session: idle this long and modules ask for the password again.
# Its cookie (__Host-UNICLOUD_SSO) is set up in SsoAuthorizationServerConfig.
spring.session.timeout=30m
# ...and however busy, it ends this long after the password was typed (SsoSessionMaxAgeFilter)
app.sso.session-max-age=8h
# The authorization server stores token times as TIMESTAMP; these keep them exact in UTC
# whatever the server's or the JVM's time zone (MySQL Connector/J "preserve instants").
spring.datasource.hikari.data-source-properties.preserveInstants=true
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
# Azure's ingress ends TLS and passes X-Forwarded-Proto; redirects and the issuer must say https
server.forward-headers-strategy=native
