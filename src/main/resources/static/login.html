<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход · UniCloud Portal</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="mock-banner" class="mock-banner" hidden>ДЕМО РЕЖИМ: данните са фалшиви, сървърът не се използва</div>

<main class="card card-narrow">
    <h1>UniCloud Portal</h1>
    <p class="muted">Вход в университетския портал</p>

    <form id="login-form" novalidate>
        <label for="email">Имейл</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>

        <label for="password">Парола</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <p id="error" class="error" role="alert" hidden></p>

        <button id="submit" type="submit">Вход</button>
    </form>
</main>

<script src="/js/api.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
